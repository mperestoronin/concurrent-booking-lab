name: Проверка учебного каркаса
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Режим проверки
        type: choice
        default: smoke
        options: [smoke, base, expert]
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python -m compileall -q app tests scripts
      - run: docker compose up --build -d --wait
      - name: Интеграционные сценарии
        run: docker compose --profile test run --build --rm tests python tests/run_tests.py --mode "${{ inputs.mode || 'smoke' }}"
      - name: Журналы контейнеров
        if: always()
        run: docker compose logs --no-color > reports/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results
          path: reports/
      - if: always()
        run: docker compose down
