services:
  postgres:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-lab-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.8-bookworm
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-local-lab-only}@postgres:5432/${POSTGRES_DB:-booking}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 4s
      retries: 30
    restart: unless-stopped
  tests:
    profiles: [test]
    build: .
    # Только одноразовый тестовый контейнер: запись bind-mounted reports на Linux.
    user: "0:0"
    environment:
      <<: *app-env
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-local-lab-only}@postgres:5432/${POSTGRES_DB:-booking}
      TEST_REDIS_URL: redis://redis:6379/15
      PGOPTIONS: "-c statement_timeout=15000 -c lock_timeout=10000"
    depends_on:
      app: {condition: service_healthy}
    volumes:
      - ./reports:/lab/reports
    command: [python, tests/run_tests.py, --mode, smoke]
volumes:
  pgdata:
